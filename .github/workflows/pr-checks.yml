name: PR Checks

on:
    pull_request:
        branches: [master, dev]
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: [master]

jobs:
    validate:
        name: Type Check, Build & Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26.8.1"
                  cache: "npm"

            - name: Install and verify npm CLI
              run: |
                  npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
                  test "$(node --version)" = "v26.8.1"
                  test "$(npm --version)" = "12.0.2"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Format check
              run: npm run format:check

            - name: Type check
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build and verify package
              run: npm run check:package

            - name: Security audit
              run: npm audit --audit-level=high
              continue-on-error: false

    compatibility-matrix:
        name: OpenCode ${{ matrix.opencode }} compatibility
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                opencode: ["1.4.3", "latest"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26.8.1"
                  cache: "npm"

            - name: Install and verify npm CLI
              run: |
                  npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
                  test "$(node --version)" = "v26.8.1"
                  test "$(npm --version)" = "12.0.2"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Install OpenCode compatibility target
              run: npm install --no-save --package-lock=false --no-audit --no-fund "@opencode-ai/plugin@${{ matrix.opencode }}" "@opencode-ai/sdk@${{ matrix.opencode }}"

            - name: Type check
              run: npm run typecheck

            - name: Build and import plugin
              run: npm run build && node -e "import('./dist/index.js')"

    opencode-compatibility:
        name: opencode-compatibility
        needs: [compatibility-matrix, host-integration]
        if: ${{ always() }}
        runs-on: ubuntu-latest

        steps:
            - name: Verify all compatibility targets
              run: |
                  test "${{ needs.compatibility-matrix.result }}" = "success"
                  test "${{ needs.host-integration.result }}" = "success"

    host-integration:
        name: Real OpenCode host integration
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout plugin
              uses: actions/checkout@v7

            - name: Setup Node.js test runner
              uses: actions/setup-node@v7
              with:
                  node-version: "26.8.1"
                  cache: "npm"

            - name: Install and verify npm CLI
              run: |
                  npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
                  test "$(node --version)" = "v26.8.1"
                  test "$(npm --version)" = "12.0.2"

            - name: Install plugin dependencies
              run: npm ci --no-audit --no-fund

            - name: Checkout pinned host implementation
              uses: actions/checkout@v7
              with:
                  repository: LeXwDeX/OpenCode-GraphAgent
                  ref: 8d9972908c308da1836a004cebe27c7c23db1acc
                  path: .host/opencode

            - name: Setup host runtime
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"

            - name: Install pinned host dependencies
              working-directory: .host/opencode
              run: bun install --frozen-lockfile --ignore-scripts --filter './packages/opencode'

            - name: Test actual host dispatch, storage and provider serialization
              env:
                  OPENCODE_SOURCE_ROOT: ${{ github.workspace }}/.host/opencode
              run: npm run test:host
