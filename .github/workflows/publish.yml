name: Publish to NPM

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Build & Publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26.8.1"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false

            - name: Verify release tag matches package version
              run: node scripts/verify-release.mjs

            - name: Install and verify npm CLI
              run: |
                  npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
                  test "$(node --version)" = "v26.8.1"
                  test "$(npm --version)" = "12.0.2"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Security audit
              run: npm audit --audit-level=high
              continue-on-error: false

            - name: Type check
              run: npm run typecheck

            - name: Format check
              run: npm run format:check

            - name: Test
              run: npm test

            - name: Build and verify package
              run: npm run check:package

            - name: Ensure version is not already published
              run: |
                  PKG_NAME=$(node -p "require('./package.json').name")
                  PKG_VERSION=$(node -p "require('./package.json').version")

                  if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
                    echo "::error::${PKG_NAME}@${PKG_VERSION} is already published. Bump version before publishing."
                    exit 1
                  fi

            - name: Publish to NPM
              run: npm publish --access public
